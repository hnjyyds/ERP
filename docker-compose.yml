name: xinpei

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build:
      context: ./backend
    image: xinpei-backend:latest
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/.data/xinpei.db
      REDIS_URL: redis://redis:6379/0
      TZ: Asia/Shanghai
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Xinpei@2026}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-系统管理员}
      ADMIN_PASSWORD_RESET: ${ADMIN_PASSWORD_RESET:-false}
    volumes:
      - xinpei_data:/app/.data
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/v1/health", timeout=3)
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    logging: *default-logging

  worker:
    build:
      context: ./backend
    image: xinpei-backend:latest
    command: ["arq", "app.worker.WorkerSettings"]
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/.data/xinpei.db
      REDIS_URL: redis://redis:6379/0
      TZ: Asia/Shanghai
    volumes:
      - xinpei_data:/app/.data
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
    image: xinpei-frontend:latest
    ports:
      - "${NGINX_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

volumes:
  xinpei_data:
  redis_data:
