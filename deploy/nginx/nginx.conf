worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_x_request_id $correlation_id {
        default $request_id;
        "~^[A-Za-z0-9._:-]{1,128}$" $http_x_request_id;
    }

    log_format request_json escape=json
        '{"timestamp":"$time_iso8601",'
        '"level":"INFO",'
        '"logger":"nginx.access",'
        '"event":"proxy_request_completed",'
        '"request_id":"$correlation_id",'
        '"client_ip":"$remote_addr",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"status_code":$status,'
        '"duration_seconds":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_duration_seconds":"$upstream_response_time"}';
    access_log /dev/stdout request_json;
    error_log /dev/stderr warn;

    sendfile on;
    keepalive_timeout 65;

    upstream frontend_app {
        server frontend:80;
    }

    upstream backend_api {
        server backend-a:8000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name _;

        location /api/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $correlation_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_hide_header X-Request-ID;
            add_header X-Request-ID $correlation_id always;
            add_header X-Upstream-Addr $upstream_addr always;
        }

        location /uploads/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $correlation_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_hide_header X-Request-ID;
            add_header X-Request-ID $correlation_id always;
            add_header X-Upstream-Addr $upstream_addr always;
        }

        location /mcp {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            # The backend is private to this trusted proxy. Normalize the upstream
            # Host so FastMCP's DNS-rebinding guard accepts any deployed public domain.
            proxy_set_header Host 127.0.0.1:8000;
            proxy_set_header X-Request-ID $correlation_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_hide_header X-Request-ID;
            add_header X-Request-ID $correlation_id always;
            add_header X-Upstream-Addr $upstream_addr always;
        }

        location / {
            proxy_pass http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Request-ID $correlation_id always;
        }
    }
}
