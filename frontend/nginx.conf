worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 保留客户端传入的安全关联 ID，否则生成一个；后端不可用时仍然可追踪。
    map $http_x_request_id $correlation_id {
        default $request_id;
        "~^[A-Za-z0-9._:-]{1,128}$" $http_x_request_id;
    }

    log_format request_json escape=json
        '{"timestamp":"$time_iso8601",'
        '"level":"INFO",'
        '"logger":"nginx.access",'
        '"event":"proxy_request_completed",'
        '"request_id":"$correlation_id",'
        '"client_ip":"$remote_addr",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"status_code":$status,'
        '"duration_seconds":"$request_time",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_duration_seconds":"$upstream_response_time"}';
    access_log /dev/stdout request_json;
    error_log /dev/stderr warn;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 8m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    upstream backend_api {
        server backend:8000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $correlation_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_hide_header X-Request-ID;
            add_header X-Request-ID $correlation_id always;
            proxy_read_timeout 120s;
        }

        location /uploads/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $correlation_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_hide_header X-Request-ID;
            add_header X-Request-ID $correlation_id always;
        }

        location /mcp {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            # 后端只在内网，统一 Host 以通过 FastMCP 的 DNS rebinding 校验。
            proxy_set_header Host 127.0.0.1:8000;
            proxy_set_header X-Request-ID $correlation_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_set_header Upgrade $http_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_hide_header X-Request-ID;
            add_header X-Request-ID $correlation_id always;
        }

        # SPA 路由回退：刷新 /finance/receipts/xxx 这类前端路由不会 404。
        location / {
            try_files $uri $uri/ /index.html;
            add_header X-Request-ID $correlation_id always;
        }

        location = /index.html {
            add_header Cache-Control "no-store";
            add_header X-Request-ID $correlation_id always;
        }
    }
}
